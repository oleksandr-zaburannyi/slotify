type Query {
    ping: Boolean

    auditLogs(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): AuditLogs! @auth(permission: "auditLogs")
    games(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): Games! @auth(permission: "games")
    wallets(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): Wallets! @auth(permission: "wallets")
    rgss(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): RGSs! @auth(permission: "rgss")
    accounts(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): Accounts! @auth(permission: "accounts")
    players(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): Players! @auth(permission: "players")
    sessions(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): Sessions! @auth(permission: "sessions")
    transactions(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): Transactions! @auth(permission: "transactions")
    gameWin(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): GameWin! @auth(permission: "gameWin")
    DGE_gameSummary(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): DGEGameSummary! @auth(permission: "transactions")
    currencyExchange(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): CurrencyExchanges! @auth(permission: "currencyExchange")
    currencyAliases(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): CurrencyAliases! @auth(permission: "currencyAliases")
    currencyFeeds(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): CurrencyFeeds! @auth(permission: "manageCurrencies")
    reportReceivers(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): ReportReceivers! @auth(permission: "reportSender")
    reportExclusion(limit: Int, offset: Int, sort: Sort, filter: [Filter], options: JSONObject): ReportExclusions! @auth(permission: "reportExclusion")
    rgsList: [String] @auth(permission: "*")
    walletList: [String] @auth(permission: "*")
    gameList: [String] @auth(permission: "*")
    providerList: [String] @auth(permission: "*")
    operatorList: [String] @auth(permission: "*")
    brandList: [String] @auth(permission: "*")
    jurisdictionList: [String] @auth(permission: "*")
    currencyList: [String] @auth(permission: "*")
    availableGames(wallet: String, operator: String, brand: String): [AvailableGame] @auth(permission: "availableBets")
}

type ImportResults {
    added: Int
    edited: Int
    ids: JSON
}

type Mutation {
    resetPassword(email: String!): Boolean @log(variables: false, result: false)
    changePassword(key: String!, password: String!): ChangePasswordResult @log(variables: false, result: false)

    login(email: String!, password: String!): Login @log(variables: false, result: false)
    logout: Boolean @log(variables: false, result: false)

    addAccount(data: AccountInput!): ID @auth(permission: "manageAccounts") @log(variables: true, result: true)
    editAccount(id: ID!, data: AccountInput!): Boolean @auth(permission: "manageAccounts") @log(variables: true, result: true)
    deleteAccount(id: ID!): Boolean @auth(permission: "manageAccounts") @log(variables: true, result: true)
    importAccounts(data: String!): ImportResults @auth(permission: "manageAccounts") @log(variables: true, result: true)

    addCurrencyAlias(data: CurrencyAliasInput!): ID @auth(permission: "manageCurrencies") @log(variables: true, result: true)
    editCurrencyAlias(alias: ID!, data: CurrencyAliasInput!): Boolean @auth(permission: "manageCurrencies") @log(variables: true, result: true)
    deleteCurrencyAlias(alias: ID!): Boolean @auth(permission: "manageCurrencies") @log(variables: true, result: true)

    addCurrencyExchange(data: CurrencyExchangeInput!): ID @auth(permission: "manageCurrencies") @log(variables: true, result: true)
    editCurrencyExchange(id: ID!, data: CurrencyExchangeInput!): Boolean @auth(permission: "manageCurrencies") @log(variables: true, result: true)
    deleteCurrencyExchange(id: ID!): Boolean @auth(permission: "manageCurrencies") @log(variables: true, result: true)
    importCurrencyAliases(data: String!): ImportResults @auth(permission: "manageCurrencies") @log(variables: true, result: true)
    fetchCurrencies(date: String!): Boolean @auth(permission: "manageCurrencies") @log(variables: true, result: true)

    editCurrencyFeed(feed: String!, data: CurrencyFeedInput!): Boolean @auth(permission: "manageCurrencies") @log(variables: true, result: true)

    addRgs(data: RGSInput!): ID @auth(permission: "manageRgss") @log(variables: true, result: true)
    editRgs(id: ID!, data: RGSInput!): Boolean @auth(permission: "manageRgss") @log(variables: true, result: true)
    deleteRgs(id: ID!): Boolean @auth(permission: "manageRgss") @log(variables: true, result: true)

    addWallet(data: WalletInput!): ID @auth(permission: "manageWallets") @log(variables: true, result: true)
    editWallet(id: ID!, data: WalletInput!): Boolean @auth(permission: "manageWallets") @log(variables: true, result: true)
    deleteWallet(id: ID!): Boolean @auth(permission: "manageWallets") @log(variables: true, result: true)
    resetWalletInspection(id: ID!): Boolean @auth(permission: "manageWallets") @log(variables: true, result: true)

    addGame(data: GameInput!): ID @auth(permission: "manageGames") @log(variables: true, result: true)
    editGame(game: ID!, data: GameInput!): Boolean @auth(permission: "manageGames") @log(variables: true, result: true)
    deleteGame(game: ID!): Boolean @auth(permission: "manageGames") @log(variables: true, result: true)
    importGames(data: String!): ImportResults @auth(permission: "manageGames") @log(variables: true, result: true)

    closeTransaction(id: ID!): Boolean @auth(permission: "closeTransaction") @log(variables: true, result: true)
    regenerateGameWin(date: String!): Boolean @auth(permission: "regenerateGameWin") @log(variables: true, result: true)

    editPlayer(id: ID!, value: PlayerInput!): Boolean @auth(permission: "managePlayers") @log(variables: true, result: true)
    endSession(sessionId: ID!): Boolean @auth(permission: "sessions") @log(variables: true, result: true)

    walletVerifier(wallet: String!, operator: String!, provider: String!, game: String!, key: String!, game2: String, key2: String): WalletVerifierResults! @auth(permission: "verifier")

    addReportReceiver(data: ReportReceiverInput!): ID @auth(permission: "manageReportSender") @log(variables: true, result: true)
    editReportReceiver(id: ID!, data: ReportReceiverInput!): Boolean @auth(permission: "manageReportSender") @log(variables: true, result: true)
    deleteReportReceiver(id: ID!): Boolean @auth(permission: "manageReportSender") @log(variables: true, result: true)
    sendReport(id: ID!, timestamp: Float): Boolean @auth(permission: "manageReportSender") @log(variables: true, result: true)
    downloadReport(id: ID!, timestamp: Float): JSON @auth(permission: "manageReportSender") @log(variables: true, result: true)

    addReportExclusion(data: ReportExclusionInput!): ID @auth(permission: "manageReportExclusion") @log(variables: true, result: true)
    editReportExclusion(id: ID!, data: ReportExclusionInput!): Boolean @auth(permission: "manageReportExclusion") @log(variables: true, result: true)
    deleteReportExclusion(id: ID!): Boolean @auth(permission: "manageReportExclusion") @log(variables: true, result: true)
}
